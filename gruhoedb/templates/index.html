<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gruhö-DB</title>
    <script type="text/javascript" src="https://cdn.datatables.net/v/dt/jq-3.6.0/dt-1.13.2/datatables.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/v/dt/jq-3.6.0/dt-1.13.2/datatables.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script type="text/javascript">
        $(document).ready(function () {
            $('#searchResults').DataTable({
                "searching": false,
                "lengthChange": false
            });
        });
    </script>
</head>
<body>
<div class="container">
<div class="item">
<a href="/"><h1>GruHö-Datenbank-Suche</h1></a>
<form action="/search" method="get">
    <div>
        <label for="artist">Artist:</label>
        <input id="artist" name="artist" />
    </div>
    <div>
        <label for="album">Album:</label>
        <input id="album" name="album" />
    </div>
    <div>
        <label>From:</label>
        <input type="date" id="from" name="from" />
    </div>
    <div>
        <label>To:</label>
        <input type="date" id="to" name="to" />
    </div>
    <div>
        <label>Output format:</label>
        <span>
            <input type="radio" name="outputformat" value="json" /><label>JSON</label>
            <input type="radio" name="outputformat" value="html" checked /><label>HTML</label>
        </span>
    </div>
    <div>
        <input type="submit" value="Search" />
    </div>
</form>
{% if search_results %}
    <table id="searchResults">
        <thead>
            <tr>
                <th>Year</th>
                <th>Month</th>
                <th>Day</th>
                <th>Artist</th>
                <th>Album</th>
            </tr>
        </thead>
        <tbody>
        {% for result in search_results %}
            <tr>
                <td class="num">{{ result.year }}</td>
                <td class="num">{{ result.month }}</td>
                <td class="num">{{ result.day }}</td>
                <td>{{ result.artist }}</td>
                <td>{{ result.album }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endif %}
</div>
</div>
</body>
</html>
