<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gruhö-DB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
<div class="container">
<div class="item">
<h1>GruHö-Datenbank-Suche</h1>
<form action="/search" method="get">
    <div>
        <label for="artist">Artist:</label>
        <input id="artist" name="artist" />
    </div>
    <div>
        <label for="album">Album:</label>
        <input id="album" name="album" />
    </div>
    <div>
        <label>Output format:</label>
        <span>
            <input type="radio" name="outputformat" value="json" /><label>JSON</label>
            <input type="radio" name="outputformat" value="html" checked /><label>HTML</label>
        </span>
    </div>
    <div>
        <input type="submit" value="Search" />
    </div>
</form>
{% if search_results %}
    <table>
        <thead>
            <tr>
                <th>Year</th>
                <th>Month</th>
                <th>Day</th>
                <th>Artist</th>
                <th>Album</th>
            </tr>
        </thead>
        <tbody>
        {% for result in search_results %}
            <tr>
                <td class="num">{{ result.year }}</td>
                <td class="num">{{ result.month }}</td>
                <td class="num">{{ result.day }}</td>
                <td>{{ result.artist }}</td>
                <td>{{ result.album }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endif %}
</div>
</div>
</body>
</html>
