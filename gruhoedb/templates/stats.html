<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gruhö-DB &mdash; Statistics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
  <div class="item">
    <canvas id="stats-all"></canvas>
  </div>
  <div class="item">
    <canvas id="stats-year"></canvas>
  </div>
</div>

<script>
  function showBarChart(element, data) {
    new Chart(element, {
      type: 'bar',
      data: {
        labels: data.map(row => row[0] + '-' + row[1]),
        datasets: [{
          data: data.map(row => row[2])
        }]
      },
      options: {
        plugins: {
          legend: {
            display: false
          }
        },
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  }

  const all = document.getElementById('stats-all');
  showBarChart(all, {{data_all}});

  const year = document.getElementById('stats-year');
  showBarChart(year, {{data_year}});
</script>
</body>
</html>
