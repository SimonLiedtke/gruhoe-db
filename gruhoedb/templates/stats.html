<!DOCTYPE html>
<html lang="en">
<head>
    <!-- https://codeberg.org/ThisIsFine/gruhoe-db -->
    <meta charset="UTF-8">
    <title>Gruhö-DB &mdash; Statistics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script src="{{ url_for('static', filename='chart.js') }}"></script>
    <script src="{{ url_for('static', filename='stats.js') }}"></script>
</head>
<body>
<div class="container">
  <a href="/"><h1>GruHö-Datenbank-Suche</h1></a>
</div>

<div class="container">
  <div class="item">
    <canvas id="stats-all"></canvas>
  </div>
  <div class="item">
    <canvas id="stats-year"></canvas>
  </div>
</div>
<div class="container">
  <div class="item">
    <canvas id="stats-bubbles"></canvas>
  </div>
  <div class="item">
    <canvas id="stats-weekdays"></canvas>
  </div>
</div>

<script>
  const all = document.getElementById('stats-all');
  const all_data = JSON.parse({{data_all | tojson}});
  showBarChart(all, 'All Picks', all_data.map(row => row[0] + '-' + row[2]), all_data.map(row => row[3]));

  const yearly_data = JSON.parse({{data_year | tojson}});
  const year = document.getElementById('stats-year');
  showBarChart(year, 'Picks of the Current Year', yearly_data.map(row => row[2]), yearly_data.map(row => row[3]));

  const allBubbled = document.getElementById('stats-bubbles');
  showBubbleChart(allBubbled, 'Picks by Year and Month', all_data);

  const weekdays = document.getElementById('stats-weekdays');
  showBarChart(weekdays, 'Picks by Day of the Week', {{data_weekdays | tojson}}.map(row => row[0]), {{data_weekdays | tojson}}.map(row => row[1]));
</script>
</body>
</html>
